name: ci

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[learn]"  # the package plus scikit-learn==1.9.1 (learn extra)
      - name: No data in the repo
        run: python scripts/check_no_data.py
      - name: Tests
        run: pytest -q
