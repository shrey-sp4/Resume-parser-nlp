[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-parser"
version = "0.1.0"
description = "Rule-based parser that turns academic CVs (PDF) into JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.7",
    "pdfminer.six==20250506",
    "jsonschema==4.25.1",
    "rapidfuzz==3.14.1",
    "numpy==2.3.3",
    "scipy==1.16.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "reportlab==4.4.4",
    "pillow==13.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src for the package, scripts for the guard and the fake resume builder
pythonpath = ["src", "scripts"]
